name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to create or update, for example v1.0.1'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      FORTUNA_UPLOAD_STORE_PASSWORD: ${{ secrets.FORTUNA_UPLOAD_STORE_PASSWORD }}
      FORTUNA_UPLOAD_KEY_ALIAS: ${{ secrets.FORTUNA_UPLOAD_KEY_ALIAS }}
      FORTUNA_UPLOAD_KEY_PASSWORD: ${{ secrets.FORTUNA_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore long-term signing key
        env:
          FORTUNA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FORTUNA_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FORTUNA_UPLOAD_KEYSTORE_BASE64:-}" || -z "${FORTUNA_UPLOAD_STORE_PASSWORD:-}" || -z "${FORTUNA_UPLOAD_KEY_ALIAS:-}" || -z "${FORTUNA_UPLOAD_KEY_PASSWORD:-}" ]]; then
            echo "Fortuna release signing secrets are incomplete" >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/fortuna-release.jks"
          printf '%s' "$FORTUNA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "FORTUNA_UPLOAD_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint and build web app
        run: npm run release:web

      - name: Build Android signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain

      - name: Verify release signature identity
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name 'Fortuna-*.apk' -print -quit)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          EXPECTED_CERT="$(tr '[:upper:]' '[:lower:]' < android/release-signing-cert.sha256 | tr -d '[:space:]:')"
          CERT_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK_SOURCE")"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/ { print $2; exit }' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_SOURCE"
          if [[ -z "$ACTUAL_CERT" || "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            printf '%s\n' "$CERT_OUTPUT" >&2
            echo "Release signing certificate mismatch" >&2
            exit 1
          fi
          echo "Verified release certificate SHA-256: $ACTUAL_CERT"

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          fi

          VERSION="${TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$TAG" && "$TAG" == "${GITHUB_REF_NAME}" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p release
          APK_NAME="Fortuna-${VERSION}-release.apk"
          APK_SOURCE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name 'Fortuna-*.apk' -print -quit)"
          if [[ -z "$APK_SOURCE" ]]; then
            echo "No Fortuna APK found in the Gradle debug output directory" >&2
            exit 1
          fi
          cp "$APK_SOURCE" "release/$APK_NAME"
          echo "apk_path=release/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortuna-release-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.release_tag }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          VERSION: ${{ steps.apk.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_SOURCE="release/github/$TAG.md"
          if [[ -f "$NOTES_SOURCE" ]]; then
            cp "$NOTES_SOURCE" release-notes.md
          else
            cat > release-notes.md <<EOF
          ## Fortuna $VERSION

          ### Core app

          Local-first accounts, holdings, liabilities, allocation plans, charts, Excel backup/restore, and an optional portable snapshot.

          ### Privacy

          No Fortuna login, analytics SDK, or advertising SDK is required. Financial records stay local unless the user explicitly exports or shares them.

          ### Installation

          Download the release-signed APK on an Android device, allow installation from unknown apps when prompted, and install it. Future GitHub releases keep the same signing identity so Android can install them as updates.
          EOF
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "Fortuna $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK_PATH" --title "Fortuna $VERSION" --notes-file release-notes.md
          fi
